name: news

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print posts, don't publish (1 = yes)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-opus-5-5' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
          SIGNATURE: ${{ vars.SIGNATURE }}
          MIN_GAP_MINUTES: ${{ vars.MIN_GAP_MINUTES || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state: update seen items" && git push)
