name: news

on:
  schedule:
    # every 15 min during posting hours, Yerevan = UTC+4 (bot.py checks the hours too)
    - cron: "*/15 4-18 * * 1-5"   # Mon-Fri 08:00-23:00
    - cron: "*/15 5-18 * * 0,6"   # Sat-Sun 09:00-23:00
  push:  # editing this file (re)starts the self-chaining loop below
    branches: [main]
    paths: [".github/workflows/news.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print posts, don't publish (1 = yes)"
        default: "0"
      test_ai:
        description: "Test AI rewrite on latest items, post nothing (1 = yes)"
        default: "0"

permissions:
  contents: write
  actions: write  # lets a run start the next one

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-opus-5-5' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
          SIGNATURE: ${{ vars.SIGNATURE }}
          MIN_GAP_MINUTES: ${{ vars.MIN_GAP_MINUTES || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          TEST_AI: ${{ github.event.inputs.test_ai || '0' }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state: update seen items" && git pull --rebase && git push)

      # GitHub's cron above is unreliable, so each run waits until 15 min have passed and starts the next one.
      # The concurrency group keeps at most one run going and one waiting, so chains never pile up.
      - name: Start next run
        if: always() && github.event.inputs.dry_run != '1' && github.event.inputs.test_ai != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 900 - ($(date +%s) - START) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          gh workflow run news.yml --ref main -R "$GITHUB_REPOSITORY"
