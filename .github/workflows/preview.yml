name: frame-preview

on:
  push:
    paths: ["frame.py", "preview.py", "brand/*.png"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python preview.py
      - name: Save previews
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add brand/preview
          git diff --cached --quiet || (git commit -m "preview: framed samples" && git pull --rebase && git push)
