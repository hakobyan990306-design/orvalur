<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Օրվա լուրը — լոգո</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@300;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: #e9e7e1; font-family: 'Noto Sans Armenian', sans-serif; }
  canvas { display: block; margin: 0 0 24px; max-width: 100%; height: auto; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  #avatar, .av { border-radius: 50%; width: 320px; }
</style>
</head>
<body>
<canvas id="avatar" width="1024" height="1024"></canvas>
<canvas id="avatar-orange" class="av" width="1024" height="1024"></canvas>
<canvas id="wordmark" width="2000" height="440"></canvas>
<canvas id="wordmark-white" width="2000" height="440" style="background:#111"></canvas>
<script>
const ORANGE = '#F2A800', INK = '#111111', FONT = "'Noto Sans Armenian'";

// Draws "օրվա" (light) + "լուրը" (black) + orange dot on one baseline, centered at cx.
function inline(ctx, cx, baseline, size, color) {
  const a = 'օրվա', b = 'լուրը';
  ctx.font = `300 ${size}px ${FONT}`; const wa = ctx.measureText(a).width;
  ctx.font = `900 ${size}px ${FONT}`; const wb = ctx.measureText(b).width;
  const dot = size * 0.13, gap = size * 0.06;
  let x = cx - (wa + wb + gap + dot * 2) / 2;
  ctx.fillStyle = color;
  ctx.font = `300 ${size}px ${FONT}`; ctx.fillText(a, x, baseline); x += wa;
  ctx.font = `900 ${size}px ${FONT}`; ctx.fillText(b, x, baseline); x += wb + gap;
  ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(x + dot, baseline - dot, dot, 0, Math.PI * 2); ctx.fill();
}

function drawAvatar(id = "avatar", bg = INK, fg = "#ffffff", dotColor = ORANGE) {
  const c = document.getElementById(id), ctx = c.getContext("2d"), S = c.width;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, S, S);   // Telegram crops to a circle itself
  ctx.textBaseline = 'alphabetic';
  const top = 'օրվա', bot = 'լուրը';
  ctx.font = `300 230px ${FONT}`; const wt = ctx.measureText(top).width;
  ctx.font = `900 250px ${FONT}`; const wb = ctx.measureText(bot).width;
  const dot = 32, gap = 14;
  ctx.fillStyle = fg;
  ctx.font = `300 230px ${FONT}`; ctx.fillText(top, (S - wt) / 2, 470);
  const x = (S - (wb + gap + dot * 2)) / 2;
  ctx.font = `900 250px ${FONT}`; ctx.fillText(bot, x, 720);
  ctx.fillStyle = dotColor; ctx.beginPath(); ctx.arc(x + wb + gap + dot, 720 - dot, dot, 0, Math.PI * 2); ctx.fill();
}

function drawWordmark(id, color) {
  const c = document.getElementById(id), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  inline(ctx, c.width / 2, 300, 300, color);
}

document.fonts.load(`300 100px ${FONT}`, 'օրվա').then(() => document.fonts.load(`900 100px ${FONT}`, 'լուրը')).then(() => {
  drawAvatar();
  drawAvatar('avatar-orange', ORANGE, INK, '#ffffff');
  drawWordmark('wordmark', INK);
  drawWordmark('wordmark-white', '#ffffff');
  window.LOGO_READY = true;
});
</script>
</body>
</html>
